<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Memory Match — Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent1: #06b6d4;
            --accent2: #7c3aed;
            --accent3: #ec4899;
        }

        .card {
            perspective: 100%;
        }

        .inner {
            transform-style: preserve-3d;
            transition: transform .52s cubic-bezier(.2, .9, .3, 1);
        }

        .card.flip .inner {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            backface-visibility: hidden;
            border-radius: .75rem;
            overflow: hidden;
        }

        .back {
            transform: rotateY(180deg);
        }

        .card .inner>* {
            transition: transform .25s ease;
        }

        .card.matched .back {
            box-shadow: 0 6px 22px rgba(124, 58, 237, .35), 0 0 18px rgba(6, 182, 212, .12) inset;
            transform: rotateY(180deg) scale(1.03);
            transition: box-shadow .35s, transform .35s;
        }

        @keyframes shake {
            0% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-8px)
            }

            50% {
                transform: translateX(8px)
            }

            75% {
                transform: translateX(-6px)
            }

            100% {
                transform: translateX(0)
            }
        }

        .card.shake {
            animation: shake .5s ease;
        }

        .neon-wrapper {
            display: inline-flex;
            gap: .5rem;
            align-items: center;
            padding: .35rem .6rem;
            background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .02));
            border-radius: .6rem;
            border: 1px solid rgba(255, 255, 255, .06);
            box-shadow: 0 6px 20px rgba(12, 12, 12, .5), 0 0 18px rgba(124, 58, 237, .06) inset;
        }

        .neon-value {
            font-size: 1.05rem;
            color: #e6f9ff;
            text-shadow: 0 0 8px rgba(6, 182, 212, .1), 0 0 18px rgba(124, 58, 237, .06);
            font-weight: 800;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-200 font-[Inter] flex items-center justify-center min-h-screen p-4 flex flex-col">

    <canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:60;"></canvas>

    <div class="w-full max-w-3xl bg-gradient-to-br from-cyan-700 via-purple-700 to-pink-600 rounded-2xl shadow-xl p-6 relative">
        <div class="text-center mb-4">
            <h1 class="text-2xl font-extrabold text-white">Memory Card Game</h1>
            <p class="text-xs text-white/80">Match pairs — good luck!</p>
            <div class="mt-3 flex items-center justify-center gap-4">
                <div>Level: <span id="levelDisplay" class="font-bold">1-1</span></div>
                <div class="neon-wrapper">
                    <div class="text-xs text-white/70">Time</div>
                    <div id="timerDisplay" class="neon-value">00:00</div>
                </div>
                <div id="bestDisplay" class="text-xs text-white/70 ml-2">Best: --:--</div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-3">
            <div class="bg-white/10 px-3 py-1 rounded text-sm">Moves: <span id="moves">0</span></div>
            <div class="flex gap-2">
                <button id="restartBtn" class="bg-white/6 px-3 py-1 rounded text-sm">Restart</button>
                <button id="menuBtnInline" class="bg-white/6 px-3 py-1 rounded text-sm">Levels</button>
            </div>
        </div>

        <div id="gameBoard" class="grid gap-3"></div>
    </div>

    <footer class="mt-6 text-center text-xs text-white/60">Designed by <b>Girish Panda</b></footer>

    <!-- Congrats Overlay -->
    <div id="congratsOverlay" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-gray-900 text-white w-72 p-5 rounded-2xl shadow-xl text-center border border-white/10">
            <h2 class="text-xl font-extrabold text-cyan-400">Level Complete!</h2>
            <p class="text-xs text-white/60 mt-1">Level <span id="congratsLevel"></span> finished</p>

            <div class="mt-4 text-sm space-y-1">
                <div>⏱ Time: <span id="finalTime" class="font-bold text-cyan-300"></span></div>
                <div>🎯 Moves: <span id="finalMoves" class="font-bold text-pink-300"></span></div>
            </div>

            <div class="mt-5 flex flex-col gap-2">
                <button id="continueBtn" class="w-full bg-gradient-to-r from-cyan-400 to-purple-500 py-2 rounded-xl text-sm font-semibold hover:scale-105 transition">
                    Next ▶
                </button>

                <button id="menuBtn" class="w-full bg-white/10 py-2 rounded-xl text-sm border border-white/10 hover:bg-white/20 transition">
                    Home ⬅
                </button>
            </div>
        </div>
    </div>

    <script>
        // SETTINGS
        const SETTINGS = JSON.parse(localStorage.getItem("settings")) || {
            masterVol: 70,
            musicVol: 60,
            sfxVol: 60,
            darkMode: true,
            vibration: true
        };
        document.documentElement.classList.toggle('dark', SETTINGS.darkMode);
        const MASTER_VOL = SETTINGS.masterVol;
        const VIBRATION_ENABLED = SETTINGS.vibration;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        let muted = false;
        document.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

        function playTone(freq, type = 'sine', time = 0.12, vol = 0.08) {
            if (muted) return;
            vol *= MASTER_VOL / 100;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type;
            o.frequency.value = freq;
            g.gain.value = vol;
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start();
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + time);
            o.stop(audioCtx.currentTime + time + 0.02);
        }

        function vibrate(ms) {
            if (VIBRATION_ENABLED && navigator.vibrate) navigator.vibrate(ms);
        }

        // LEVEL & SUB
        const params = new URLSearchParams(location.search);
        let level = parseInt(params.get('level')) || 1;
        let subLevel = parseInt(params.get('sub')) || 1;
        const SUBS = 5;

        // GRID & CARDS
        function getGrid(l, s) {
            const r = l + 3;
            let c = r + (s - 1);
            if ((r * c) % 2 !== 0) c++;
            return { rows: r, cols: c };
        }

        const baseIcons = ["🍀","⭐","🔥","🌙","💎","⚡","🌸","🎯","🧩","🎵","🌈","🍎","🐱","🐶","⚽","🚀","🌹","🍕","🎲","🛡️"];
        const board = document.getElementById('gameBoard');
        const movesEl = document.getElementById('moves');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtnInline = document.getElementById('menuBtnInline');
        const levelDisplayEl = document.getElementById('levelDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const bestDisplay = document.getElementById('bestDisplay');

        let rows, cols, cards = [], flipped = [], moves = 0, lock = false, matchedPairs = 0;
        let timerStarted = false, levelStartTime = 0, timerInterval = null, lastElapsed = 0;

        function formatTime(sec) {
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;
            levelStartTime = Date.now();
            timerInterval = setInterval(() => {
                const e = (Date.now() - levelStartTime) / 1000;
                lastElapsed = e;
                timerDisplay.textContent = formatTime(e);
            }, 250);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerStarted = false;
        }

        function linearIndex(l, s) { return (l - 1) * SUBS + s; }
        function getUnlockedCount() { const v = localStorage.getItem('unlockedCount'); return v ? Number(v) : 1; }
        function setUnlockedCount(n) { localStorage.setItem('unlockedCount', String(n)); }
        function bestKey() { return `memory_best_${level}-${subLevel}`; }
        function loadBest() { const v = localStorage.getItem(bestKey()); return v ? Number(v) : null; }
        function saveBest(sec) { localStorage.setItem(bestKey(), String(Math.floor(sec))); }

        function spawnConfetti() {
            const confettiCanvas = document.getElementById('confettiCanvas');
            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = innerWidth;
            confettiCanvas.height = innerHeight;
            let confetti = [];
            for (let i = 0; i < 120; i++) {
                confetti.push({ x: Math.random() * confettiCanvas.width, y: Math.random() * confettiCanvas.height - confettiCanvas.height, r: Math.random() * 6 + 3, d: Math.random() * 30 + 10, tilt: Math.random() * 10 - 10, color: `hsl(${Math.random() * 360},80%,60%)`, tiltAngle: 0, tiltSpeed: Math.random() * 0.07 + 0.04 });
            }
            let anim;
            function draw() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                confetti.forEach(p => {
                    ctx.beginPath();
                    ctx.lineWidth = p.r / 2;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                    p.tiltAngle += p.tiltSpeed;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle);
                    if (p.y > confettiCanvas.height) { p.y = -10; p.x = Math.random() * confettiCanvas.width; }
                });
                anim = requestAnimationFrame(draw);
            }
            draw();
            setTimeout(() => { cancelAnimationFrame(anim); ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); }, 2500);
        }

        function setupLevelFromURL() {
            const grid = getGrid(level, subLevel);
            rows = grid.rows;
            cols = grid.cols;
            levelDisplayEl.textContent = `${level}-${subLevel}`;
            const best = loadBest();
            bestDisplay.textContent = best ? formatTime(best) : 'Best: --:--';
            moves = 0; movesEl.textContent = moves; flipped = []; lock = false; matchedPairs = 0;
            stopTimer(); timerDisplay.textContent = '00:00';
            generateCards(); renderBoard();
        }

        function generateCards() {
            const total = rows * cols;
            const neededCount = Math.ceil(total / 2);
            const icons = [];
            let i = 0;
            while (icons.length < neededCount) { icons.push(baseIcons[i % baseIcons.length]); i++; }
            cards = [...icons.slice(0, neededCount), ...icons.slice(0, neededCount)].sort(() => Math.random() - 0.5);
        }

        function renderBoard() {
            board.innerHTML = ''; board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            cards.forEach((icon, idx) => {
                const card = document.createElement('div');
                card.className = "card relative h-20 bg-gray-800 rounded-lg flex items-center justify-center cursor-pointer select-none text-xl font-bold transition-transform duration-300 perspective game-card";
                card.dataset.index = idx;
                card.innerHTML = `<div class="inner w-full h-full relative">
                    <div class="front absolute inset-0 bg-gray-900 border border-gray-700 rounded-lg flex items-center justify-center">?</div>
                    <div class="back absolute inset-0 bg-gray-800 rounded-lg flex items-center justify-center">${icon}</div>
                </div>`;
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lock) return;
            if (!timerStarted) startTimer();
            if (card.classList.contains('flip') || card.classList.contains('matched')) return;
            playTone(820, 'sine', 0.06, 0.05);
            vibrate(10);
            card.classList.add('flip');
            const innerChildren = card.querySelectorAll('.inner > *'); innerChildren.forEach(el => el.style.transform = 'translateY(-3px) scale(1.03)');
            setTimeout(() => innerChildren.forEach(el => el.style.transform = ''), 120);
            flipped.push(card);
            if (flipped.length === 2) checkMatch();
        }

        function checkMatch() {
            lock = true; moves++; movesEl.textContent = moves;
            const [c1, c2] = flipped;
            const i1 = cards[c1.dataset.index], i2 = cards[c2.dataset.index];
            if (i1 === i2) {
                playTone(520, 'triangle', 0.2, 0.09); playTone(780, 'sine', 0.14, 0.05);
                c1.classList.add('matched'); c2.classList.add('matched');
                flipped = []; lock = false; matchedPairs++;
                checkLevelComplete();
            } else {
                playTone(230, 'sine', 0.28, 0.07);
                [c1, c2].forEach(c => { c.classList.add('shake'); setTimeout(() => c.classList.remove('shake'), 520); });
                setTimeout(() => { c1.classList.remove('flip'); c2.classList.remove('flip'); flipped = []; lock = false; }, 700);
            }
        }

        function unlockNextSub() {
            const currentIdx = linearIndex(level, subLevel);
            const unlocked = getUnlockedCount();
            if (currentIdx >= unlocked) setUnlockedCount(currentIdx + 1);
        }

        function checkLevelComplete() {
            if (matchedPairs === cards.length / 2) {
                stopTimer();
                const elapsed = lastElapsed;
                const best = loadBest();
                let improved = false;
                if (best === null || elapsed < best) {
                    saveBest(elapsed); improved = true;
                }
                spawnConfetti();
                unlockNextSub();
                document.getElementById('finalMoves').textContent = moves;
                document.getElementById('finalTime').textContent = formatTime(elapsed);
                document.getElementById('congratsLevel').textContent = `${level}-${subLevel}`;
                document.getElementById('congratsOverlay').classList.remove('hidden');
            }
        }

        function goToNextSub() {
            let nextSub = subLevel + 1;
            let nextLevel = level;
            if (nextSub > SUBS) { nextSub = 1; nextLevel = level + 1; }
            level = nextLevel; subLevel = nextSub;
            document.getElementById('congratsOverlay').classList.add('hidden');
            setupLevelFromURL();
        }

        restartBtn.onclick = () => setupLevelFromURL();
        menuBtnInline.onclick = () => location.href = 'levels.html';

        document.addEventListener('DOMContentLoaded', () => {
            const cont = document.getElementById('continueBtn');
            const menu = document.getElementById('menuBtn');
            if (cont) cont.onclick = () => goToNextSub();
            if (menu) menu.onclick = () => location.href = 'index.html';
            setupLevelFromURL();
        });
    </script>
</body>

</html>
